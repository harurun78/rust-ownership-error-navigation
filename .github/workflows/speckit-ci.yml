name: Spec Kit Check

on:
  push:
    branches: [main, master]
    paths:
      - '.github/**'
      - '.specify/**'
      - 'docs/**'
      - 'specs/**'
      - 'tasks/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/**'
      - '.specify/**'
      - 'docs/**'
      - 'specs/**'
      - 'tasks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speckit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Spec Kit repository checks
        run: |
          test -f specs/001-ownership-report-mvp/spec.md
          test -f specs/001-ownership-report-mvp/plan.md
          test -f specs/001-ownership-report-mvp/tasks.md
          test -f specs/001-ownership-report-mvp/contracts/diagnostic-report.schema.json

          open_tasks=$(grep -c '^- \[ \]' specs/001-ownership-report-mvp/tasks.md || true)
          if [ "$open_tasks" -ne 0 ]; then
            echo "::error::Spec Kit tasks.md still has $open_tasks open task(s)."
            exit 1
          fi

          checked_tasks=$(grep -c '^- \[x\]' specs/001-ownership-report-mvp/tasks.md || true)
          if [ "$checked_tasks" -lt 56 ]; then
            echo "::error::Expected at least 56 completed Spec Kit tasks, found $checked_tasks."
            exit 1
          fi
