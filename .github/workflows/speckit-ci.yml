name: Spec Kit Check

on:
  push:
    branches: [main, master]
    paths:
      - '.github/**'
      - '.specify/**'
      - 'docs/**'
      - 'specs/**'
      - 'tasks/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/**'
      - '.specify/**'
      - 'docs/**'
      - 'specs/**'
      - 'tasks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speckit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Spec Kit CLI
        run: |
          if command -v specify >/dev/null 2>&1; then
            specify check
          else
            echo "Spec Kit CLI is not installed on this runner; skipping environment check."
          fi
